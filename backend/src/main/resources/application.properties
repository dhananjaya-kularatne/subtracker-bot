# Application name
spring.application.name=subtracker-bot
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/subtracker_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

