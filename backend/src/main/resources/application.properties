# Application name
spring.application.name=subtracker-bot
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/subtracker_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=subtracker_dj_bot

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Daily reminders at 09:00 Asia/Colombo. Set REMINDER_CRON="0 * * * * *" locally to check every minute.
reminder.cron=${REMINDER_CRON:0 0 9 * * *}

# Enable only after configuring a Brevo API key and verified sender.
brevo.enabled=${BREVO_ENABLED:false}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Subtracker Bot}

